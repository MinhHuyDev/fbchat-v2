name: CI

on:
  push:
    branches:
      - main
      - beta-async/await
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Required quality gate
    uses: ./.github/workflows/quality-gate.yml
    permissions:
      contents: read
