name: CI

on:
  push:
    branches: [main, beta-async/await]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Ruff critical checks
        run: ruff check src tests scripts
      - name: Check Python formatting
        run: black --check src tests scripts
      - name: Mypy public package surface
        run: mypy
      - name: Set up Node.js when website source is tracked
        if: ${{ hashFiles('website/script.js') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check website JavaScript syntax
        if: ${{ hashFiles('website/script.js') != '' }}
        run: node --check website/script.js
      - name: Report unavailable website source
        if: ${{ hashFiles('website/script.js') == '' }}
        run: echo "website/script.js is not tracked; JavaScript syntax check skipped."

  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run pytest
        run: pytest tests/ -v --tb=short

  package-smoke:
    name: Wheel and editable install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and verify fresh installs
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"

          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install "$wheel_path"
          .venv-wheel/bin/python scripts/verify_distribution.py "$wheel_path"

          python -m venv .venv-editable
          .venv-editable/bin/python -m pip install --upgrade pip
          .venv-editable/bin/python -m pip install -e .
          .venv-editable/bin/python scripts/verify_distribution.py

  go-bridge:
    name: Go bridge tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge-e2ee/go.mod
          cache-dependency-path: bridge-e2ee/go.sum
      - name: Run Go tests
        working-directory: bridge-e2ee
        run: go test ./...
      - name: Run Go vet
        working-directory: bridge-e2ee
        run: go vet ./...
