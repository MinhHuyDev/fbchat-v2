[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fbchat-v2"
version = "2.2.2"
description = "Thư viện Python hiện đại cho Facebook Messenger API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MinhHuyDev", email = "z.m008v@gmail.com" }]
dependencies = [
    "httpx>=0.27.0",
    "paho-mqtt>=1.6.1",
    "pyotp>=2.9.0",
    "requests>=2.32.0"
]

[project.urls]
Homepage = "https://github.com/MinhHuyDev/fbchat-v2"
Repository = "https://github.com/MinhHuyDev/fbchat-v2"
Issues = "https://github.com/MinhHuyDev/fbchat-v2/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=7.4.0",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy>=1.11.0"
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/_core",
    "src/_features",
    "src/_messaging",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Ruff bắt các lỗi parser/runtime-critical; Black chịu trách nhiệm định dạng.
select = ["E9", "F"]

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
files = [
    "src",
    "scripts",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
